<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TransitIL — Smart Bus Routes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2438;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #f0f4ff;
      --muted: #8896b3;
      --border: rgba(0,229,255,0.12);
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: rgba(10,15,30,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); z-index: 100; flex-shrink: 0; }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; color: var(--text); }
    .logo span { color: var(--accent); }
    .badge { font-size: 0.7rem; background: rgba(0,229,255,0.12); color: var(--accent); border: 1px solid rgba(0,229,255,0.25); padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 360px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
    .sidebar-inner { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .section-label { font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .input-group { display: flex; flex-direction: column; gap: 10px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .dot { position: absolute; left: 14px; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-from { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot-to { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
    .input-wrap input { width: 100%; padding: 12px 12px 12px 36px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-wrap input:focus { border-color: rgba(0,229,255,0.4); box-shadow: 0 0 0 3px rgba(0,229,255,0.07); }
    .input-wrap input::placeholder { color: var(--muted); }
    .connector { width: 2px; height: 10px; background: linear-gradient(to bottom, var(--accent), var(--accent2)); margin-left: 18px; border-radius: 2px; }
    .mode-row { display: flex; gap: 8px; }
    .mode-btn { flex: 1; padding: 9px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mode-btn .icon { font-size: 1.1rem; }
    .mode-btn.active { background: rgba(0,229,255,0.1); border-color: rgba(0,229,255,0.4); color: var(--accent); }
    .mode-btn:hover:not(.active) { border-color: rgba(255,255,255,0.15); color: var(--text); }
    .go-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #00b8d4); border: none; border-radius: 10px; color: #0a0f1e; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(0,229,255,0.25); }
    .go-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(0,229,255,0.35); }
    .go-btn:active { transform: translateY(0); }
    .go-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .divider { height: 1px; background: var(--border); }
    .results { display: flex; flex-direction: column; gap: 10px; }
    .result-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.2s; animation: slideIn 0.3s ease forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .result-card:hover { border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.04); }
    .result-card.selected { border-color: rgba(0,229,255,0.5); background: rgba(0,229,255,0.07); }
    .result-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .result-duration { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .result-traffic { font-size: 0.72rem; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
    .traffic-low { background: rgba(16,185,129,0.15); color: var(--success); }
    .traffic-med { background: rgba(245,158,11,0.15); color: var(--warning); }
    .traffic-high { background: rgba(239,68,68,0.15); color: #f87171; }
    .result-steps { display: flex; gap: 6px; flex-wrap: wrap; }
    .step-tag { font-size: 0.75rem; padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,0.06); color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .step-tag.transit { background: rgba(124,58,237,0.15); color: #a78bfa; }
    .result-meta { margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.85rem; padding: 10px 0; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #f87171; font-size: 0.82rem; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 10px 12px; }
    .empty-state { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px 0; line-height: 1.6; }
    .empty-state .big { font-size: 1.8rem; margin-bottom: 8px; }
    #map { flex: 1; background: var(--bg); }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<header>
  <div class="logo">Transit<span>IL</span></div>
  <div class="badge">Tel Aviv Prototype</div>
</header>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-inner">
      <div>
        <div class="section-label">Plan your route</div>
        <div class="input-group">
          <div class="input-wrap">
            <div class="dot dot-from"></div>
            <input type="text" id="origin" placeholder="From (e.g. Tel Aviv Savidor)"/>
          </div>
          <div class="connector"></div>
          <div class="input-wrap">
            <div class="dot dot-to"></div>
            <input type="text" id="destination" placeholder="To (e.g. Dizengoff Center)"/>
          </div>
        </div>
      </div>
      <div>
        <div class="section-label">Travel mode</div>
        <div class="mode-row">
          <button class="mode-btn active" data-mode="TRANSIT" onclick="setMode(this)"><span class="icon">🚌</span>Transit</button>
          <button class="mode-btn" data-mode="DRIVING" onclick="setMode(this)"><span class="icon">🚗</span>Drive</button>
          <button class="mode-btn" data-mode="WALKING" onclick="setMode(this)"><span class="icon">🚶</span>Walk</button>
        </div>
      </div>
      <button class="go-btn" id="goBtn" onclick="getRoute()">GET ROUTE →</button>
      <div class="divider"></div>
      <div id="results">
        <div class="empty-state">
          <div class="big">🗺️</div>
          Enter origin & destination<br/>to see routes
        </div>
      </div>
    </div>
  </div>
  <div id="map"></div>
</div>
<script>
  let map, directionsService, directionsRenderer;
  let currentMode = 'TRANSIT';

  function setMode(btn) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 32.0853, lng: 34.7818 },
      zoom: 13,
      styles: [
        { elementType: 'geometry', stylers: [{ color: '#0a0f1e' }] },
        { elementType: 'labels.text.fill', stylers: [{ color: '#8896b3' }] },
        { elementType: 'labels.text.stroke', stylers: [{ color: '#0a0f1e' }] },
        { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#1a2438' }] },
        { featureType: 'road.arterial', elementType: 'geometry', stylers: [{ color: '#1e2d45' }] },
        { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#243352' }] },
        { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#060d1a' }] },
        { featureType: 'poi', elementType: 'geometry', stylers: [{ color: '#111827' }] },
        { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#1a2438' }] },
        { featureType: 'transit.station', elementType: 'labels.text.fill', stylers: [{ color: '#00e5ff' }] },
      ],
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({
      map,
      polylineOptions: { strokeColor: '#00e5ff', strokeWeight: 4, strokeOpacity: 0.85 }
    });

    const bounds = new google.maps.LatLngBounds(
      new google.maps.LatLng(29.5, 34.2),
      new google.maps.LatLng(33.3, 35.9)
    );
    const opts = { bounds, componentRestrictions: { country: 'il' } };
    new google.maps.places.Autocomplete(document.getElementById('origin'), opts);
    new google.maps.places.Autocomplete(document.getElementById('destination'), opts);
  }

  function getRoute() {
    const origin = document.getElementById('origin').value.trim();
    const destination = document.getElementById('destination').value.trim();
    if (!origin || !destination) { showError('Please enter both origin and destination.'); return; }

    const btn = document.getElementById('goBtn');
    btn.disabled = true;
    btn.textContent = 'Searching...';
    showLoading();

    const request = {
      origin, destination,
      travelMode: google.maps.TravelMode[currentMode],
      provideRouteAlternatives: true,
      region: 'il',
    };

    if (currentMode === 'DRIVING') {
      request.drivingOptions = { departureTime: new Date(), trafficModel: google.maps.TrafficModel.BEST_GUESS };
    }
    if (currentMode === 'TRANSIT') {
      request.transitOptions = { departureTime: new Date(), routingPreference: google.maps.TransitRoutePreference.FEWER_TRANSFERS };
    }

    directionsService.route(request, (result, status) => {
      btn.disabled = false;
      btn.textContent = 'GET ROUTE →';
      if (status === 'OK') {
        directionsRenderer.setDirections(result);
        directionsRenderer.setRouteIndex(0);
        showResults(result.routes);
      } else {
        showError('Could not find a route. Try different locations.');
      }
    });
  }

  function showLoading() {
    document.getElementById('results').innerHTML = '<div class="loading"><div class="spinner"></div>Finding best routes...</div>';
  }

  function showError(msg) {
    document.getElementById('results').innerHTML = '<div class="error-msg">⚠️ ' + msg + '</div>';
  }

  function showResults(routes) {
    const html = routes.map((route, i) => {
      const leg = route.legs[0];
      const displayTime = leg.duration_in_traffic ? leg.duration_in_traffic.text : leg.duration.text;
      let trafficLabel = '', trafficClass = '';
      if (leg.duration_in_traffic) {
        const ratio = leg.duration_in_traffic.value / leg.duration.value;
        if (ratio < 1.15) { trafficLabel = 'Light traffic'; trafficClass = 'traffic-low'; }
        else if (ratio < 1.4) { trafficLabel = 'Moderate traffic'; trafficClass = 'traffic-med'; }
        else { trafficLabel = 'Heavy traffic'; trafficClass = 'traffic-high'; }
      }
      const tags = (leg.steps || []).slice(0, 5).map(step => {
        if (step.travel_mode === 'TRANSIT') {
          const line = step.transit && step.transit.line ? (step.transit.line.short_name || step.transit.line.name || '') : '';
          return '<span class="step-tag transit">🚌 ' + line + '</span>';
        } else if (step.travel_mode === 'WALKING') {
          return '<span class="step-tag">🚶 Walk ' + step.duration.text + '</span>';
        }
        return '<span class="step-tag">🚗 ' + step.duration.text + '</span>';
      }).join('');

      return '<div class="result-card ' + (i===0?'selected':'') + '" onclick="selectRoute(' + i + ', this)">' +
        '<div class="result-top"><div class="result-duration">' + displayTime + '</div>' +
        (trafficClass ? '<div class="result-traffic ' + trafficClass + '">' + trafficLabel + '</div>' : '') +
        '</div><div class="result-steps">' + (tags || '<span class="step-tag">Direct</span>') + '</div>' +
        '<div class="result-meta">' + leg.distance.text + ' · Departs now</div></div>';
    }).join('');

    document.getElementById('results').innerHTML =
      '<div class="section-label">' + routes.length + ' route' + (routes.length>1?'s':'') + ' found</div>' +
      '<div class="results">' + html + '</div>';
  }

  function selectRoute(index, el) {
    document.querySelectorAll('.result-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    directionsRenderer.setRouteIndex(index);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') getRoute(); });
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCxdWQ_suSxmA9PnfWcCMO2ClkIdpKvF88&libraries=places&callback=initMap"></script>
</body>
</html>
